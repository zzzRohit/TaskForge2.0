<!DOCTYPE html>

<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0" name="viewport"/><meta content="web_blank" name="shell-type"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/><link href="https://fonts.googleapis.com" rel="preconnect"/><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/><link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&amp;family=Geist:wght@100..900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><style>@layer base{html,body{margin:0;padding:0;}body{overscroll-behavior:none;}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "inverse-surface": "#2f3038", "destructive-wash": "#fee2e2", "surface-container-high": "#e8e7f1", "on-tertiary-container": "#7671ff", "role-admin-bg": "#e0e7ff", "role-member-fg": "#52525b", "tertiary-fixed": "#e2dfff", "error-container": "#ffdad6", "inverse-on-surface": "#f1effa", "on-error-container": "#93000a", "on-primary-container": "#858387", "on-primary-fixed": "#1b1b1e", "border-subtle": "#e4e4e7", "surface-tint": "#5f5e61", "on-secondary-container": "#616364", "on-surface-variant": "#47464b", "on-secondary-fixed-variant": "#454748", "on-primary-fixed-variant": "#47464a", "error": "#ba1a1a", "on-tertiary-fixed": "#0f0069", "surface-container-highest": "#e3e1ec", "secondary-fixed": "#e2e2e3", "role-owner-bg": "#fef3c7", "surface-container-low": "#f4f2fd", "primary": "#000000", "on-surface": "#1a1b22", "outline-variant": "#c8c5cb", "canvas-bg": "#fafafa", "on-secondary-fixed": "#1a1c1d", "surface-container-lowest": "#ffffff", "role-member-bg": "#f4f4f5", "on-background": "#1a1b22", "surface-variant": "#e3e1ec", "primary-fixed-dim": "#c8c5ca", "background": "#fbf8ff", "tertiary-fixed-dim": "#c3c0ff", "on-primary": "#ffffff", "primary-container": "#1b1b1e", "outline": "#77767b", "surface-bright": "#fbf8ff", "on-tertiary": "#ffffff", "tertiary": "#000000", "secondary": "#5d5e60", "secondary-container": "#dfdfe0", "surface-card": "#ffffff", "tertiary-container": "#0f0069", "secondary-fixed-dim": "#c6c6c7", "inverse-primary": "#c8c5ca", "surface-dim": "#dad9e3", "on-error": "#ffffff", "primary-fixed": "#e4e1e6", "role-owner-fg": "#92400e", "role-admin-fg": "#3730a3", "status-emerald": "#16a34a", "destructive-crimson": "#dc2626", "on-secondary": "#ffffff", "on-tertiary-fixed-variant": "#3323cc", "surface": "#fbf8ff", "surface-container": "#eeedf7" }, "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, "spacing": { "space-md": "1rem", "space-lg": "1.5rem", "space-xl": "2.5rem", "gutter": "1rem", "space-xs": "0.25rem", "gutter-desktop": "1.5rem", "margin-desktop": "2.5rem", "margin-tablet": "1.5rem", "space-sm": "0.5rem", "margin": "1rem" }, "fontFamily": { "headline-md": [ "DM Sans" ], "display-xl": [ "DM Sans" ], "body-sm": [ "DM Sans" ], "headline-sm": [ "DM Sans" ], "body-sm-medium": [ "DM Sans" ], "label-caps": [ "Geist" ], "headline-lg": [ "DM Sans" ], "display-xl-mobile": [ "DM Sans" ], "body-base": [ "DM Sans" ], "label-mono-sm": [ "Geist" ] }, "fontSize": { "headline-md": [ "20px", { "lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "600" } ], "display-xl": [ "48px", { "lineHeight": "52px", "letterSpacing": "-0.04em", "fontWeight": "600" } ], "body-sm": [ "13px", { "lineHeight": "18px", "letterSpacing": "0em", "fontWeight": "400" } ], "headline-sm": [ "16px", { "lineHeight": "24px", "letterSpacing": "-0.01em", "fontWeight": "600" } ], "body-sm-medium": [ "13px", { "lineHeight": "18px", "letterSpacing": "0em", "fontWeight": "500" } ], "label-caps": [ "11px", { "lineHeight": "14px", "letterSpacing": "0.08em", "fontWeight": "600" } ], "headline-lg": [ "28px", { "lineHeight": "34px", "letterSpacing": "-0.02em", "fontWeight": "600" } ], "display-xl-mobile": [ "32px", { "lineHeight": "38px", "letterSpacing": "-0.02em", "fontWeight": "600" } ], "body-base": [ "15px", { "lineHeight": "22px", "letterSpacing": "0em", "fontWeight": "400" } ], "label-mono-sm": [ "10px", { "lineHeight": "12px", "letterSpacing": "0.04em", "fontWeight": "500" } ] } } } };</script></head><body class="bg-canvas-bg font-body-base text-on-surface antialiased min-h-screen flex flex-col justify-center items-center"><main class="w-full"><div class="flex flex-col w-full items-center justify-center py-12 px-4 sm:px-6 lg:px-8 relative">
<div class="absolute inset-0 pointer-events-none flex items-center justify-center overflow-hidden">
<div class="w-[620px] h-[620px] rounded-full bg-gradient-to-tr from-surface-container-high/40 via-surface-container-low/20 to-transparent blur-3xl opacity-70 -translate-y-12"></div>
</div>
<div class="w-full max-w-md relative z-10 flex flex-col items-center">
<div class="mb-6 flex items-center gap-1.5 p-1 rounded-full bg-surface-container-low shadow-sm">
<button class="px-3 py-1 rounded-full font-label-caps text-label-caps tracking-wider transition-all duration-150 bg-surface-card text-on-surface shadow-sm" id="btn-state-default" onclick="setState('default')" type="button">
        DEFAULT
      </button>
<button class="px-3 py-1 rounded-full font-label-caps text-label-caps tracking-wider text-secondary transition-all duration-150 hover:text-on-surface" id="btn-state-loading" onclick="setState('loading')" type="button">
        LOADING
      </button>
<button class="px-3 py-1 rounded-full font-label-caps text-label-caps tracking-wider text-secondary transition-all duration-150 hover:text-on-surface" id="btn-state-form-error" onclick="setState('form-error')" type="button">
        GLOBAL ERROR
      </button>
<button class="px-3 py-1 rounded-full font-label-caps text-label-caps tracking-wider text-secondary transition-all duration-150 hover:text-on-surface" id="btn-state-field-error" onclick="setState('field-error')" type="button">
        FIELD ERROR
      </button>
</div>
<div class="w-full bg-surface-card rounded-xl p-8 sm:p-10 shadow-sm relative transition-all duration-300">
<div class="flex flex-col items-center text-center">
<div class="w-11 h-11 rounded-lg bg-primary flex items-center justify-center text-on-primary mb-5 shadow-sm">
<svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24">
<path d="M12 2L2 7l10 5 10-5-10-5z"></path>
<path d="M2 17l10 5 10-5"></path>
<path d="M2 12l10 5 10-5"></path>
</svg>
</div>
<h1 class="font-headline-lg text-headline-lg text-on-surface tracking-tight">
          Welcome back to TaskForge
        </h1>
<p class="font-body-sm text-body-sm text-secondary mt-2">
          Sign in to access your organizations and boards.
        </p>
<button class="mt-4 inline-flex items-center gap-2 px-3 py-1 rounded-full bg-surface-container-low hover:bg-surface-container text-on-surface font-label-mono-sm text-label-mono-sm transition-all duration-150 group" onclick="quickFill()" type="button">
<span class="w-1.5 h-1.5 rounded-full bg-status-emerald"></span>
<span class="text-secondary group-hover:text-on-surface">Quick fill:</span>
<span class="font-body-sm-medium text-body-sm-medium">sarah@taskforge.dev</span>
<span class="material-symbols-outlined text-[14px] text-secondary group-hover:text-on-surface transition-transform group-hover:translate-x-0.5">arrow_forward</span>
</button>
</div>
<div class="hidden mt-6 p-3 rounded-lg bg-destructive-wash text-destructive-crimson text-left transition-all" id="global-error-banner">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-[18px]">error</span>
<span class="font-body-sm-medium text-body-sm-medium">Invalid email or password combination</span>
</div>
</div>
<form class="mt-7 space-y-4" onsubmit="event.preventDefault(); simulateSubmit();">
<div class="space-y-1.5 text-left">
<div class="flex justify-between items-center">
<label class="font-body-sm-medium text-body-sm-medium text-on-surface" for="email">
              Email address
            </label>
<span class="hidden font-body-sm text-body-sm text-destructive-crimson" id="email-error-label">
              Valid email required
            </span>
</div>
<div class="relative">
<input autocomplete="email" class="w-full h-10 px-3.5 rounded-lg bg-surface-container-lowest text-on-surface font-body-sm text-body-sm placeholder:text-outline-variant outline-none shadow-sm transition-all focus:bg-surface-card" id="email" name="email" placeholder="name@company.com" type="email"/>
</div>
</div>
<div class="space-y-1.5 text-left">
<div class="flex justify-between items-center">
<label class="font-body-sm-medium text-body-sm-medium text-on-surface" for="password">
              Password
            </label>
<a class="font-body-sm text-body-sm text-secondary hover:text-on-surface transition-colors duration-150" href="#forgot">
              Forgot password?
            </a>
</div>
<div class="relative">
<input autocomplete="current-password" class="w-full h-10 px-3.5 pr-10 rounded-lg bg-surface-container-lowest text-on-surface font-body-sm text-body-sm placeholder:text-outline-variant outline-none shadow-sm transition-all focus:bg-surface-card" id="password" name="password" placeholder="••••••••••••" type="password"/>
<button aria-label="Toggle password view" class="absolute inset-y-0 right-0 pr-3 flex items-center text-outline hover:text-on-surface transition-colors duration-150" onclick="togglePasswordVisibility()" type="button">
<span class="material-symbols-outlined text-[18px]" id="pw-icon">visibility</span>
</button>
</div>
<p class="hidden font-body-sm text-body-sm text-destructive-crimson pt-0.5" id="password-error-label">
            Password must be at least 8 characters
          </p>
</div>
<div class="pt-2">
<button class="w-full h-10 rounded-lg bg-primary text-on-primary font-body-sm-medium text-body-sm-medium flex items-center justify-center transition-all duration-150 hover:bg-primary/90 active:scale-[0.99] shadow-sm relative overflow-hidden" id="submit-btn" type="submit">
<span class="flex items-center gap-2" id="btn-label">
<span>Sign in</span>
<span class="material-symbols-outlined text-[16px]">arrow_forward</span>
</span>
<span class="hidden items-center justify-center" id="btn-spinner">
<svg class="animate-spin h-4 w-4 text-on-primary" fill="none" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
<path class="opacity-75" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z" fill="currentColor"></path>
</svg>
</span>
</button>
</div>
</form>
<div class="mt-6 pt-5 flex items-center justify-center gap-1.5 bg-surface-container-low/50 -mx-8 -mb-8 sm:-mx-10 sm:-mb-10 py-4 rounded-b-xl">
<span class="font-body-sm text-body-sm text-secondary">Don't have an account?</span>
<a class="font-body-sm-medium text-body-sm-medium text-on-surface hover:underline transition-all" href="/signup">Sign up</a>
</div>
</div>
<div class="mt-8 flex items-center justify-center gap-6 text-outline">
<div class="flex items-center gap-1.5 font-label-mono-sm text-label-mono-sm">
<span class="material-symbols-outlined text-[14px]">lock</span>
<span>256-BIT ENCRYPTION</span>
</div>
<span class="w-1 h-1 rounded-full bg-outline-variant"></span>
<div class="flex items-center gap-1.5 font-label-mono-sm text-label-mono-sm">
<span class="material-symbols-outlined text-[14px]">verified_user</span>
<span>SOC-2 CERTIFIED</span>
</div>
</div>
</div>
</div>
<script>
  function setState(state) {
    const defaultBtn = document.getElementById('btn-state-default');
    const loadingBtn = document.getElementById('btn-state-loading');
    const formErrorBtn = document.getElementById('btn-state-form-error');
    const fieldErrorBtn = document.getElementById('btn-state-field-error');

    [defaultBtn, loadingBtn, formErrorBtn, fieldErrorBtn].forEach(b => {
      b.className = "px-3 py-1 rounded-full font-label-caps text-label-caps tracking-wider text-secondary transition-all duration-150 hover:text-on-surface";
    });

    const activeTokenClass = "px-3 py-1 rounded-full font-label-caps text-label-caps tracking-wider transition-all duration-150 bg-surface-card text-on-surface shadow-sm";

    const banner = document.getElementById('global-error-banner');
    const emailInput = document.getElementById('email');
    const pwInput = document.getElementById('password');
    const emailErrLabel = document.getElementById('email-error-label');
    const pwErrLabel = document.getElementById('password-error-label');
    const btnLabel = document.getElementById('btn-label');
    const btnSpinner = document.getElementById('btn-spinner');
    const submitBtn = document.getElementById('submit-btn');

    // Reset base states
    banner.classList.add('hidden');
    emailErrLabel.classList.add('hidden');
    pwErrLabel.classList.add('hidden');
    emailInput.classList.remove('bg-destructive-wash/50', 'text-destructive-crimson');
    pwInput.classList.remove('bg-destructive-wash/50', 'text-destructive-crimson');
    btnLabel.classList.remove('hidden');
    btnSpinner.classList.add('hidden');
    btnSpinner.classList.remove('flex');
    submitBtn.removeAttribute('disabled');

    if (state === 'default') {
      defaultBtn.className = activeTokenClass;
    } else if (state === 'loading') {
      loadingBtn.className = activeTokenClass;
      btnLabel.classList.add('hidden');
      btnSpinner.classList.remove('hidden');
      btnSpinner.classList.add('flex');
      submitBtn.setAttribute('disabled', 'true');
    } else if (state === 'form-error') {
      formErrorBtn.className = activeTokenClass;
      banner.classList.remove('hidden');
    } else if (state === 'field-error') {
      fieldErrorBtn.className = activeTokenClass;
      emailErrLabel.classList.remove('hidden');
      pwErrLabel.classList.remove('hidden');
      emailInput.classList.add('bg-destructive-wash/50', 'text-destructive-crimson');
      pwInput.classList.add('bg-destructive-wash/50', 'text-destructive-crimson');
      emailInput.value = 'sarah@invalid-domain';
      pwInput.value = '123';
    }
  }

  function quickFill() {
    const email = document.getElementById('email');
    const pw = document.getElementById('password');
    email.value = 'sarah@taskforge.dev';
    pw.value = '••••••••••••';
    setState('default');
  }

  function togglePasswordVisibility() {
    const input = document.getElementById('password');
    const icon = document.getElementById('pw-icon');
    if (input.type === 'password') {
      input.type = 'text';
      icon.textContent = 'visibility_off';
    } else {
      input.type = 'password';
      icon.textContent = 'visibility';
    }
  }

  function simulateSubmit() {
    setState('loading');
    setTimeout(() => {
      setState('default');
    }, 1200);
  }
</script></main></body></html>
